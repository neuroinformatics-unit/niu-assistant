# The pages the assistant routes to. Nothing here is copied: each page is read
# from its project's own repository at the pinned `ref`, so answers stay the
# same until a pin is moved on purpose. Moving a pin is a commit, and the
# benchmark is rerun after it.
#
# A page's id is "<source>/<path>". `root` is the docs folder in the repo.

